[project]
name = "depquiet-floor-test"
version = "0.1.0"
description = "Test project: security fixes that need a newer Python than requires-python allows."
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.13",
    "pillow>=12",
    "semgrep>=1.100",
]

[tool.uv]
# Lock only for Pythons where the fixed releases install. requires-python stays >=3.10.
environments = ["python_full_version >= '3.11.5'"]
