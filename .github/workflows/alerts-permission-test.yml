name: Dependabot alerts permission test
on:
  workflow_dispatch:
jobs:
  read-only:
    runs-on: ubuntu-latest
    permissions:
      security-events: read
    steps:
      - name: List Dependabot alerts with security-events read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/dependabot/alerts?state=fixed&per_page=100" --jq 'length' || echo "READ FAILED"
  write:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Try to dismiss alert 1 (already fixed) with security-events write
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/dependabot/alerts/1" -f state=dismissed -f dismissed_reason=tolerable_risk -f dismissed_comment="permission test" 2>&1 | tail -3 || true
  no-permission:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: List Dependabot alerts without security-events
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/dependabot/alerts?per_page=1" --jq 'length' 2>&1 | tail -2 || echo "READ FAILED"
